# Modbus Configurator ONEPAP.24 — конфигурация
# Значения можно переопределить флагами запуска или через onepap.ps1.

[server]
port = 8080                    # если порт недоступен, сервер выберет запасной; -strict-port отключает fallback
host = "127.0.0.1"             # 127.0.0.1 — только локально; 0.0.0.0 — по сети
read_timeout_sec = 30
write_timeout_sec = 0          # 0 = без таймаута (нужно для WebSocket)
shutdown_timeout_sec = 10

[modbus]
port = "COM4"
baudrate = 115200
data_bits = 8
stop_bits = 1
parity = "N"
slave_id = 1
timeout_ms = 500
retries = 3
retry_delay_ms = 300

[features]
auto_reconnect = true
sensor_poll_interval_ms = 500
progress_emit_interval_ms = 200

[security]
api_key = ""                   # пусто = без аутентификации
rate_limit_per_sec = 20        # лимит запросов к /api/v1/programs/*
max_ws_clients = 16

[files]
user_settings = "user_settings.toml"
log_file = "modbus-configurator.log"
